
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保全排班王 - 案場自動排班系統</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#1e40af', 
              secondary: '#64748b',
              accent: '#f59e0b',
            },
            animation: {
              'flash-red': 'flash-red-white 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              'flash-red-white': {
                '0%, 100%': { backgroundColor: '#fee2e2', color: '#dc2626', borderColor: '#fca5a5' }, // 淺紅底, 深紅字
                '50%': { backgroundColor: '#ffffff', color: '#ef4444', borderColor: '#fee2e2' }, // 白底, 紅字
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

    "uuid": "https://esm.sh/uuid@^13.0.0",

  }
}
</script>
